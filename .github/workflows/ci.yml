name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src scripts tests
      - name: Unit, contract, CLI and JS-parity tests
        run: pytest -q
      - name: CLI smoke test
        run: abtest analyze A=41/7165 B=92/7164 C=38/7068 --phi 1.67
